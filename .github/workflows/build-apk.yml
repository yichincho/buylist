name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Install ripgrep
        run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep

      # Optional: a fixed signing key lets new APKs install over older ones.
      # Save a keystore as the DEBUG_KEYSTORE_BASE64 secret (base64, password "android").
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p .keys
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > .keys/debug.keystore
          fi

      - name: Build and test
        run: ANDROID_SDK_ROOT="$ANDROID_HOME" bash scripts/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
