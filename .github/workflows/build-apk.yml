name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Install ripgrep
        run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep

      # Optional: a fixed signing key lets new APKs install over older ones.
      # Save a keystore as the DEBUG_KEYSTORE_BASE64 secret (base64, password "android").
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p .keys
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > .keys/debug.keystore
          fi

      - name: Build and test
        run: ANDROID_SDK_ROOT="$ANDROID_HOME" bash scripts/build-apk.sh

      - name: Show signing certificate
        id: signing
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          cert=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs build/outputs/apk/debug/app-debug.apk | grep -m1 "SHA-256" | sed 's/.*: //')
          echo "Signing certificate SHA-256: $cert"
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "note=固定簽章（SHA-256 ${cert:0:16}…），可直接覆蓋安裝。" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret is not set; this APK uses a one-off key and cannot update earlier installs."
            echo "note=⚠️ 未設定固定簽章，這版需要先解除安裝舊版。" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Fixed public download link (no GitHub login needed):
      # https://github.com/<owner>/<repo>/releases/download/latest-apk/app-debug.apk
      - name: Publish to the latest-apk release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk build/outputs/apk/debug/app-debug.apk \
            --target "$GITHUB_SHA" \
            --title "最新 APK" \
            --notes "自動打包：${GITHUB_REF_NAME} ${GITHUB_SHA::7}。${{ steps.signing.outputs.note }}"
